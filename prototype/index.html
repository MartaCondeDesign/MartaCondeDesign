<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NovaFit — Reserva tu clase</title>
  <meta name="description" content="Prototipo funcional mobile-first para reservar clases de gimnasio.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header id="app-header" class="app-header"></header>

    <main id="app" class="app-main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" id="nav-home" class="nav-item" data-action="nav-tab" data-route="home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button type="button" id="nav-explore" class="nav-item" data-action="nav-tab" data-route="explore">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9"/><polygon points="14.5 9.5 10 10 9.5 14.5 14 14 14.5 9.5"/>
        </svg>
        <span>Clases</span>
      </button>
      <button type="button" id="nav-bookings" class="nav-item" data-action="nav-tab" data-route="bookings">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a1.5 1.5 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a1.5 1.5 0 0 0 0-3V9Z"/>
          <line x1="12" y1="7" x2="12" y2="17" stroke-dasharray="2 2.5"/>
        </svg>
        <span>Mis reservas</span>
        <span id="nav-bookings-badge" class="nav-item__badge" aria-hidden="true"></span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
